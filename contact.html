<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Arunkumar N</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="fixed top-0 left-0 right-0 z-50 bg-[#07090e]/80 backdrop-blur-md border-b-2 border-slate-800">
        <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="pixel-font bg-yellow-400 text-black px-3 py-2 border-2 border-black rotate-[-2deg]">AN.SYS</a>
            <div class="hidden md:flex space-x-8 font-bold text-sm">
                <a href="index.html" class="hover:text-yellow-400 transition">Home</a>
                <a href="about.html" class="hover:text-yellow-400 transition">About</a>
                <a href="projects.html" class="hover:text-yellow-400 transition">Projects</a>
                <a href="experience.html" class="hover:text-yellow-400 transition">Experience</a>
                <a href="contact.html" class="text-yellow-400">Contact</a>
            </div>
        </nav>
    </header>

    <main class="max-w-xl mx-auto px-6 py-28 space-y-8 animate-fade-in">
        <h2 class="text-4xl font-extrabold border-l-8 border-yellow-400 pl-4">TRANSMISSION LINK</h2>
        <form class="comic-glass-card p-8 rounded-2xl space-y-6">
            <div>
                <label class="block pixel-font text-slate-300 mb-2">IDENTIFIER (NAME)</label>
                <input type="text" class="w-full bg-[#07090e] border-2 border-blue-500 rounded-lg p-3 text-white focus:border-yellow-400 outline-none text-sm">
            </div>
            <div>
                <label class="block pixel-font text-slate-300 mb-2">FREQUENCY (EMAIL)</label>
                <input type="email" class="w-full bg-[#07090e] border-2 border-blue-500 rounded-lg p-3 text-white focus:border-yellow-400 outline-none text-sm">
            </div>
            <div>
                <label class="block pixel-font text-slate-300 mb-2">PAYLOAD (MESSAGE)</label>
                <textarea rows="4" class="w-full bg-[#07090e] border-2 border-blue-500 rounded-lg p-3 text-white focus:border-yellow-400 outline-none text-sm"></textarea>
            </div>
            <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-extrabold py-4 rounded-xl border-2 border-black transition shadow-[4px_4px_0px_#3b82f6]">SEND TRANSMISSION ⚡</button>
        </form>
    </main>

</body>
</html>
